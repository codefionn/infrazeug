[package]
name = "hello-template"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "hello-template"
path = "src/main.rs"

[dependencies]
anyhow = "1"
infrazeug-api = { path = "../../crates/infrazeug-api" }
infrazeug-core = { path = "../../crates/infrazeug-core" }
infrazeug-shell = { path = "../../crates/infrazeug-shell" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
