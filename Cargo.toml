infrazeug-helm = { path = "crates/infrazeug-helm" }
infrazeug-templates = { path = "crates/infrazeug-templates" }
infrazeug-templates-macros = { path = "crates/infrazeug-templates-macros" }
infrazeug-migrate = { path = "crates/infrazeug-migrate" }
infrazeug-mcp = { path = "crates/infrazeug-mcp" }
infrazeug-doc-index = { path = "crates/infrazeug-doc-index" }
infrazeug-ext-ovh-api = { path = "crates/infrazeug-ext-ovh-api" }
infrazeug-ext-openstack = { path = "crates/infrazeug-ext-openstack" }
infrazeug-ovh = { path = "crates/infrazeug-ovh" }
infrazeug-openstack = { path = "crates/infrazeug-openstack" }
infrazeug-ext-ionos-cloud-api = { path = "crates/infrazeug-ext-ionos-cloud-api" }
infrazeug-ionos = { path = "crates/infrazeug-ionos" }
