[package]
name = "infrazeug-playbook"
description = "Discover and run infrazeug playbook crates from the stock CLI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
infrazeug-api = { workspace = true }
infrazeug-build = { path = "../infrazeug-build" }
infrazeug-core = { workspace = true }
infrazeug-mcp = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
infrazeug-transport = { path = "../infrazeug-transport" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
notify = "8"
notify-debouncer-mini = "0.7"
